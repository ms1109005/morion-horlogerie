<script id="racine">
  (function () {
    // Dossier du site, même servi dans un sous-dossier : les URL relatives partent de là.
    var p = location.pathname, i = p.search(/\/(collection|montre|commande)(\/|$)/);
    var b = document.createElement('base');
    b.href = i >= 0 ? p.slice(0, i + 1) : p.replace(/[^/]*$/, '');
    document.head.appendChild(b);
    var html = document.documentElement;
    html.classList.replace('no-js', 'js');
    try { if (sessionStorage.getItem('morion:intro')) html.classList.add('intro-vue'); } catch (e) {}
    if (/[?&]mouvement=reduit/.test(location.search) || (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches)) html.classList.add('reduit');
  })();
</script>
